name: Release

# Triggered by CI finishing, not by the push itself.
#
# The two used to fire in parallel on the same commit, which meant a commit
# could fail CI and still cut a version, build an IPA and refresh the Feather
# manifest — and did. Release does not set warnings-as-errors, so it published
# a commit whose iOS build CI had just rejected. Publishing something that has
# not passed the gate defeats having one.
#
# The changelog and manifest commits carry `[skip ci]`, so they raise no CI run
# and cannot trigger a release of themselves.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: Compute the version but publish nothing
        type: boolean
        default: false

# Releases must not race each other; never cancel one mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Compute version
    # Everything downstream needs this job, so one condition gates the workflow.
    # A manual dispatch has no triggering run and is trusted deliberately — it
    # is how a release is cut when CI is stuck.
    #
    # There is deliberately no second test run here. Release is triggered by CI
    # succeeding and checks out the very commit CI tested, so re-running the
    # suite adds no information and one more chance to flake — which is exactly
    # what happened: CI passed and this workflow failed the identical `swift
    # test` on the identical commit, and the release was lost to a race in a
    # test rather than to anything wrong with the code.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI tested, not whatever main happens to be now. Under
          # `workflow_run` the default is the branch tip, which is a different
          # commit the moment anything lands while a release is in flight.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0  # full history + tags for version and notes

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          version="$(scripts/next-version.sh '${{ inputs.bump || 'auto' }}')"
          if [[ "$version" == "NO_RELEASE" ]]; then
            echo "No release-worthy commits since the last tag."
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "Next version: $version"
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          {
            if [[ "${{ steps.version.outputs.released }}" == "true" ]]; then
              echo "### Releasing v${{ steps.version.outputs.version }}"
            else
              echo "### No release"
              echo
              echo "Nothing release-worthy since the last tag."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  detect-app:
    name: Detect app target
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.check.outputs.has_app }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - id: check
        run: |
          # The Xcode project is generated from project.yml, so that file — not
          # a committed .xcodeproj — is what signals an app target exists.
          if [[ -f project.yml ]] || ls *.xcodeproj *.xcworkspace >/dev/null 2>&1; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "No app target yet — skipping the IPA build." >> "$GITHUB_STEP_SUMMARY"
          fi

  ipa:
    # Built BEFORE anything is published, and uploaded as a workflow artifact
    # rather than attached to a release that does not exist yet.
    #
    # The old order tagged the version and created the release first, so a
    # failed build left a version nobody could install and a changelog entry
    # for it, with nothing to roll back automatically. Now a build failure
    # simply means no release happened.
    #
    # The IPA is UNSIGNED on purpose. Distribution is via Feather using the
    # developer's own certificate, which signs on-device — so no signing
    # identity, provisioning profile, or p12 ever needs to live in GitHub
    # secrets. That is both simpler and a smaller blast radius than signing here.
    name: Build unsigned IPA
    needs: [version, detect-app]
    if: needs.detect-app.outputs.has_app == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Kobold.xcodeproj \
            -scheme Kobold \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${{ needs.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Package IPA
        # An .ipa is just a zip with the .app inside a Payload directory.
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/*.app Payload/
          zip -qry "Kobold-${{ needs.version.outputs.version }}-unsigned.ipa" Payload
          ls -lh "Kobold-${{ needs.version.outputs.version }}-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: Kobold-*.ipa
          if-no-files-found: error
          retention-days: 7

  publish:
    # The first job that writes anything durable: the tag, the GitHub release
    # and the attached binary, and only once every part of the build has
    # already succeeded. The changelog and the Feather manifest follow in jobs
    # of their own, so neither can take the release down with it.
    name: Publish
    needs: [version, detect-app, ipa]
    # `always()` so a skipped `ipa` (no app target yet) does not skip this too,
    # combined with explicit failure checks so a *failed* build does.
    if: >-
      always()
      && needs.version.outputs.released == 'true'
      && needs.detect-app.result != 'failure'
      && needs.ipa.result != 'failure'
      && needs.ipa.result != 'cancelled'
      && inputs.dry_run != true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Download the IPA
        if: needs.detect-app.outputs.has_app == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ipa

      # Regenerated rather than passed between jobs: this checkout has the same
      # commit and the same history, so the notes are identical and there is
      # one less thing to keep in step.
      - name: Generate release notes
        run: |
          set -euo pipefail
          scripts/release-notes.sh "${{ needs.version.outputs.version }}" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub release
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          # Created before the changelog is pushed. If this step fails there is
          # simply no release; the other order leaves a changelog entry
          # describing a version that does not exist.
          #
          # The binary goes up with the release rather than after it, so the
          # release never exists in an uninstallable state.
          if [[ "${{ needs.detect-app.outputs.has_app }}" == "true" ]]; then
            gh release create "v${version}" \
              --title "v${version}" \
              --notes-file RELEASE_NOTES.md \
              --target "$(git rev-parse HEAD)" \
              "Kobold-${version}-unsigned.ipa"
          else
            gh release create "v${version}" \
              --title "v${version}" \
              --notes-file RELEASE_NOTES.md \
              --target "$(git rev-parse HEAD)"
          fi

  changelog:
    # A job of its own rather than a step of `publish`, because it is the least
    # important thing here and used to be able to stop the most important one.
    # A failure while pushing it left the release published and the Feather
    # manifest still advertising the previous version — installable by nobody —
    # over a documentation file.
    name: Update CHANGELOG
    needs: [version, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Prepend the notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Written outside the tree so it survives switching branches below.
          scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

          # Rebuilt on top of whatever the branch currently holds, rather than
          # rebased onto it.
          #
          # This checkout is the commit being released, which by definition
          # predates the *previous* release's changelog commit — so its
          # CHANGELOG is one entry stale, and prepending to it produces two
          # commits that both rewrite the same first line. That is a guaranteed
          # conflict for any two releases in a row, and a rebase cannot resolve
          # it. Taking the branch's copy and prepending to that has no seam to
          # conflict over.
          for attempt in 1 2 3; do
            # Explicit refspec: this job checked out a bare commit, so the
            # remote-tracking branch is not guaranteed to exist yet.
            git fetch --quiet --force origin "${BRANCH}:refs/remotes/origin/${BRANCH}"
            git checkout --quiet -f -B changelog "refs/remotes/origin/${BRANCH}"

            touch CHANGELOG.md
            {
              echo "# Changelog"
              echo
              cat "$RUNNER_TEMP/notes.md"
              echo
              # Prior entries, minus the old top-level heading and the blank
              # lines that would otherwise pile up at the seam.
              sed '/^# Changelog$/d' CHANGELOG.md | sed '/./,$!d'
            } > CHANGELOG.new
            mv CHANGELOG.new CHANGELOG.md

            git add CHANGELOG.md
            if git diff --cached --quiet; then
              echo "CHANGELOG already current."
              exit 0
            fi

            # [skip ci] stops this commit from re-triggering the release.
            git commit --quiet -m "docs: update changelog for v${VERSION} [skip ci]"
            if git push --quiet origin "HEAD:${BRANCH}"; then exit 0; fi
            echo "$BRANCH moved; rebuilding on top of it (attempt ${attempt})."
          done
          echo "::error::Could not push the changelog after three attempts."
          exit 1

  source:
    # Regenerates the Feather/AltStore source manifest from the published
    # releases and commits it back, so the subscribed URL always reflects what
    # is actually installable.
    name: Update Feather source
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Rebuild and commit the manifest
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Same shape as the changelog: regenerated on top of the branch each
          # time rather than rebased onto it. The manifest is built from the
          # releases API, so rebuilding it against a newer base is free and
          # always correct — where a rebase would have to merge two whole-file
          # rewrites.
          for attempt in 1 2 3; do
            git fetch --quiet --force origin main:refs/remotes/origin/main
            git checkout --quiet -f -B manifest refs/remotes/origin/main

            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | python3 scripts/build-source.py > source.json
            python3 -c "import json; json.load(open('source.json'))"

            git add source.json
            if git diff --cached --quiet; then
              echo "Source manifest unchanged."
              exit 0
            fi

            git commit --quiet -m "chore: refresh Feather source manifest [skip ci]"
            if git push --quiet origin HEAD:main; then
              # Stated plainly, because this line is the answer to "why is the
              # new build not showing up in Feather".
              python3 -c "import json,sys; a=json.load(open('source.json'))['apps']; print('Manifest offers: ' + ', '.join(x['name'] + ' ' + (x.get('versions') or [{}])[0].get('version','none') for x in a))"
              exit 0
            fi
            echo "main moved; rebuilding the manifest on top of it (attempt ${attempt})."
          done
          echo "::error::Could not push the source manifest after three attempts."
          exit 1
