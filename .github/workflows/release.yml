name: Release

# Triggered by CI finishing, not by the push itself.
#
# The two used to fire in parallel on the same commit, which meant a commit
# could fail CI and still cut a version, build an IPA and refresh the Feather
# manifest — and did. Release does not set warnings-as-errors, so it published
# a commit whose iOS build CI had just rejected. Publishing something that has
# not passed the gate defeats having one.
#
# The changelog and manifest commits carry `[skip ci]`, so they raise no CI run
# and cannot trigger a release of themselves.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: Compute the version but publish nothing
        type: boolean
        default: false

# Releases must not race each other; never cancel one mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    # Everything downstream needs this job, so one condition gates the workflow.
    # A manual dispatch has no triggering run and is trusted deliberately — it
    # is how a release is cut when CI is stuck.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    container: swift:6.0.3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Kept even though CI now gates this workflow: CI's verdict is about the
      # commit it tested, and this re-runs against the commit being published.
      # Cheap insurance against the two drifting apart.
      - name: Test
        run: swift test

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI tested, not whatever main happens to be now. Under
          # `workflow_run` the default is the branch tip, which is a different
          # commit the moment anything lands while a release is in flight.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0  # full history + tags for version and notes

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          version="$(scripts/next-version.sh '${{ inputs.bump || 'auto' }}')"
          if [[ "$version" == "NO_RELEASE" ]]; then
            echo "No release-worthy commits since the last tag."
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "Next version: $version"
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        if: steps.version.outputs.released == 'true'
        run: |
          set -euo pipefail
          scripts/release-notes.sh "${{ steps.version.outputs.version }}" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Summary
        if: always()
        run: |
          {
            if [[ "${{ steps.version.outputs.released }}" == "true" ]]; then
              echo "### Releasing v${{ steps.version.outputs.version }}"
              echo
              cat RELEASE_NOTES.md
            else
              echo "### No release"
              echo
              echo "Nothing release-worthy since the last tag."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update CHANGELOG
        if: steps.version.outputs.released == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          touch CHANGELOG.md
          {
            echo "# Changelog"
            echo
            cat RELEASE_NOTES.md
            echo
            # Prior entries, minus the old top-level heading and the blank lines
            # that would otherwise pile up at the seam.
            sed '/^# Changelog$/d' CHANGELOG.md | sed '/./,$!d'
          } > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG unchanged."
          else
            # [skip ci] stops this commit from re-triggering the release.
            git commit -m "docs: update changelog for v${{ steps.version.outputs.version }} [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Create GitHub release
        if: steps.version.outputs.released == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          gh release create "v${version}" \
            --title "v${version}" \
            --notes-file RELEASE_NOTES.md \
            --target "$(git rev-parse HEAD)"

  detect-app:
    name: Detect app target
    needs: publish
    if: needs.publish.outputs.released == 'true'
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.check.outputs.has_app }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - id: check
        run: |
          # The Xcode project is generated from project.yml, so that file — not
          # a committed .xcodeproj — is what signals an app target exists.
          if [[ -f project.yml ]] || ls *.xcodeproj *.xcworkspace >/dev/null 2>&1; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "No app target yet — skipping the IPA build." >> "$GITHUB_STEP_SUMMARY"
          fi

  ipa:
    # Dormant until an iOS app target exists; wired now so it activates on its
    # own once one lands.
    #
    # The IPA is built UNSIGNED on purpose. Distribution is via Feather using
    # the developer's own certificate, which signs on-device — so no signing
    # identity, provisioning profile, or p12 ever needs to live in GitHub
    # secrets. That is both simpler and a smaller blast radius than signing here.
    name: Build unsigned IPA
    needs: [publish, detect-app]
    if: needs.detect-app.outputs.has_app == 'true'
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Kobold.xcodeproj \
            -scheme Kobold \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${{ needs.publish.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Package IPA
        # An .ipa is just a zip with the .app inside a Payload directory. Built
        # unsigned deliberately: Feather signs on-device with the developer's own
        # certificate, so no signing identity is needed here.
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/*.app Payload/
          zip -qry "Kobold-${{ needs.publish.outputs.version }}-unsigned.ipa" Payload
          ls -lh "Kobold-${{ needs.publish.outputs.version }}-unsigned.ipa"

      - name: Attach to release
        run: |
          gh release upload "v${{ needs.publish.outputs.version }}" \
            "Kobold-${{ needs.publish.outputs.version }}-unsigned.ipa" --clobber

  source:
    # Regenerates the Feather/AltStore source manifest from the published
    # releases and commits it back, so the subscribed URL always reflects what
    # is actually installable.
    #
    # always() because the IPA job is skipped until an app target exists, and a
    # skipped dependency would otherwise skip this too — the manifest still
    # needs to stay valid and current in the meantime.
    name: Update Feather source
    needs: [publish, detect-app, ipa]
    if: always() && needs.publish.outputs.released == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Rebuild manifest
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | python3 scripts/build-source.py > source.json
          python3 -c "import json; json.load(open('source.json'))"
          cat source.json

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          if git diff --cached --quiet; then
            echo "Source manifest unchanged."
          else
            git commit -m "chore: refresh Feather source manifest [skip ci]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
